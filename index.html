<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>과학체험관 탈출 대작전</title>
<style>
:root{--navy:#0d3b57;--teal:#1593ad;--yellow:#ffc928;--orange:#ff7a2f;--cream:#fff7e3;--ink:#1d2b36}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:#fff;background:radial-gradient(circle at 50% 20%,#2bb3cf 0%,#1593ad 35%,#0d3b57 100%) fixed;
  display:flex;justify-content:center;padding:20px 16px 40px}
main{width:100%;max-width:440px;text-align:center}
.org{font-size:13px;font-weight:700;opacity:.9;margin-top:4px}
h1{font-size:30px;line-height:1.15;font-weight:900;margin:10px 0 6px;text-shadow:0 3px 0 var(--orange)}
h1 small{display:block;font-size:16px;color:var(--yellow);text-shadow:none;margin-bottom:4px}
.lead{font-size:15px;font-weight:500;line-height:1.5;opacity:.95}
.chars{display:flex;justify-content:center;gap:6px;align-items:flex-end;margin:14px 0 4px}
.chars img{height:104px}
.lock{margin:6px auto 0;width:120px;transition:transform .3s}
.lock .shackle{transition:transform .5s;transform-origin:34px 52px}
.open .shackle{transform:translateY(-10px) rotate(-28deg)}
.digits{display:flex;gap:10px;justify-content:center;margin:6px 0 14px}
.digits input{width:62px;height:76px;border-radius:12px;border:4px solid var(--orange);background:#fff;color:var(--navy);font-size:40px;font-weight:900;text-align:center;font-family:inherit;outline:none;caret-color:var(--orange)}
.digits input:focus{border-color:var(--yellow);box-shadow:0 0 0 4px rgba(255,201,40,.45)}
button{font-family:inherit;cursor:pointer;border:0}
.go{background:var(--yellow);color:var(--navy);font-size:20px;font-weight:900;padding:14px 40px;border-radius:40px;box-shadow:0 5px 0 #c99a00}
.go:active{transform:translateY(3px);box-shadow:0 2px 0 #c99a00}
.msg{min-height:28px;margin-top:14px;font-size:16px;font-weight:700}
.msg.bad{color:#ffd9b8}
.digits input.bad{border-color:#ff4d4d;background:#ffecec;color:#c62828}
.shake{animation:shake .45s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-7px)}80%{transform:translateX(7px)}}
.hints{display:none;margin-top:14px;background:rgba(255,255,255,.16);border:2px dashed rgba(255,255,255,.7);border-radius:16px;padding:14px}
.hints.show{display:block}
.hints h2{font-size:15px;color:var(--yellow);margin-bottom:8px}
.hbtn{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.hbtn button{background:#fff;color:var(--navy);font-weight:900;font-size:14px;padding:8px 14px;border-radius:20px}
.hbtn button.on{background:var(--orange);color:#fff}
.htext{margin-top:10px;font-size:14.5px;line-height:1.55;font-weight:500;text-align:left;min-height:46px}
.win{display:none}
.win.show{display:block}
.win h2{font-size:34px;font-weight:900;color:var(--yellow);text-shadow:0 3px 0 var(--orange);margin:10px 0 6px}
.win p{font-size:16px;line-height:1.55;font-weight:500}
.cert{margin-top:18px;background:#fff;color:var(--navy);border-radius:18px;padding:16px}
.cert label{display:block;font-size:14px;font-weight:900;margin-bottom:8px}
.cert input{width:100%;font-size:18px;font-family:inherit;padding:10px 12px;border:3px solid var(--teal);border-radius:10px;text-align:center}
.cert button{margin-top:10px;background:var(--teal);color:#fff;font-weight:900;font-size:16px;padding:12px 22px;border-radius:30px}
canvas#cv{display:none;width:100%;margin-top:12px;border-radius:12px}
canvas#cv.show{display:block}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:9}
footer{margin-top:26px;font-size:12px;opacity:.8}
</style>
</head>

<script>
/* 정답은 간단한 해시로만 보관합니다 (화면에서 바로 읽히지 않게) */
var ANSWER_HASH="1pt2b4fizlj", ANSWER_LEN=4;
function h(s){var a=0xdeadbeef^7,b=0x41c6ce57^7;for(var i=0;i<s.length;i++){var c=s.charCodeAt(i);a=Math.imul(a^c,2654435761);b=Math.imul(b^c,1597334677)}
  a=Math.imul(a^(a>>>16),2246822507)^Math.imul(b^(b>>>13),3266489909);b=Math.imul(b^(b>>>16),2246822507)^Math.imul(a^(a>>>13),3266489909);
  return (4294967296*(2097151&b)+(a>>>0)).toString(36)}
/* 자리별 확인용: 자리마다 해시 */
var POS_HASH=["207fpwxcspq","n4ozzwd70j","6sot7i0xs9","vreucl36vc"];
var HINTS=[
 "빛을 한 점으로 모으려면 가운데가 불룩한 렌즈가 필요해요. 돋보기를 떠올려 봐요!",
 "움직도르래는 추와 함께 움직여요. 줄 두 가닥이 무게를 나눠 들어요. 그럼 내가 당기는 힘은 어떻게 될까요?",
 "문손잡이를 돌릴 때 손잡이가 길수록 어떤지 떠올려 봐요. 두 핸들을 직접 번갈아 돌려 비교해 보세요.",
 "눈으로 본 정보는 먼저 뇌로 가서 판단돼요. 판단이 끝난 뒤에야 손이 움직여요."
];
var ins=[].slice.call(document.querySelectorAll('#digits input')),msg=document.getElementById('msg'),wrong=0;
ins.forEach(function(el,i){
  el.addEventListener('input',function(){el.classList.remove('bad');el.value=el.value.replace(/[^0-9]/g,'').slice(0,1);if(el.value&&ins[i+1])ins[i+1].focus()});
  el.addEventListener('keydown',function(e){if(e.key==='Backspace'&&!el.value&&ins[i-1])ins[i-1].focus();if(e.key==='Enter')check()});
  el.addEventListener('focus',function(){el.select()});
});
document.getElementById('goBtn').addEventListener('click',check);
var hb=document.getElementById('hbtn');
HINTS.forEach(function(t,i){var b=document.createElement('button');b.textContent='미션 '+(i+1);
  b.onclick=function(){[].forEach.call(hb.children,function(x){x.classList.remove('on')});b.classList.add('on');document.getElementById('htext').textContent=t};hb.appendChild(b)});
function check(){
  var v=ins.map(function(x){return x.value}).join('');
  if(v.length<ANSWER_LEN){say('숫자 4개를 모두 입력해 주세요.',1);return}
  if(h(v)===ANSWER_HASH){win();return}
  var bad=[];ins.forEach(function(el){el.classList.remove('bad')});
  for(var i=0;i<ANSWER_LEN;i++){if(h('p'+i+v[i])!==POS_HASH[i]){bad.push(i);ins[i].classList.add('bad')}}
  wrong++;
  var d=document.getElementById('digits');d.classList.remove('shake');void d.offsetWidth;d.classList.add('shake');
  say('자물쇠가 잠겨 있어요! '+bad.map(function(i){return (i+1)+'번째'}).join(', ')+' 숫자가 틀렸어요.',1);
  document.getElementById('hints').classList.add('show');
}
function say(t,bad){msg.textContent=t;msg.className='msg'+(bad?' bad':'')}
function win(){
  document.getElementById('lock').classList.add('open');
  setTimeout(function(){document.getElementById('play').style.display='none';document.getElementById('win').classList.add('show');window.scrollTo(0,0);boom()},700);
}
/* 폭죽 */
function boom(){
  var c=document.getElementById('conf'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;
  var cols=['#ffc928','#ff7a2f','#f2589b','#33a8e6','#fff'],p=[];
  for(var i=0;i<140;i++)p.push({x:Math.random()*c.width,y:-20-Math.random()*c.height*.6,r:4+Math.random()*6,vy:2+Math.random()*4,vx:-1.5+Math.random()*3,c:cols[i%5],a:Math.random()*6});
  var t=0;(function f(){x.clearRect(0,0,c.width,c.height);p.forEach(function(q){q.y+=q.vy;q.x+=q.vx+Math.sin(q.a+=.06);x.fillStyle=q.c;x.fillRect(q.x,q.y,q.r,q.r*1.6)});
    if(++t<260)requestAnimationFrame(f);else x.clearRect(0,0,c.width,c.height)})();
}
