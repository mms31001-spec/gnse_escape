<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>겨울방학 이벤트! 과학 보물을 찾아라!</title>
<style>
:root{--navy:#0d3b57;--teal:#1593ad;--yellow:#ffc928;--orange:#ff7a2f;--cream:#fff7e3;--ink:#1d2b36}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:#fff;background:radial-gradient(circle at 50% 20%,#5aa9da 0%,#1f6fae 40%,#0b3366 100%) fixed;
  display:flex;justify-content:center;padding:20px 16px 40px}
main{width:100%;max-width:440px;text-align:center}
.org{font-size:13px;font-weight:700;opacity:.9;margin-top:4px}
h1{font-size:30px;line-height:1.15;font-weight:900;margin:10px 0 6px;text-shadow:0 3px 0 var(--orange)}
h1 small{display:block;font-size:16px;color:var(--yellow);text-shadow:none;margin-bottom:4px}
.lead{font-size:15px;font-weight:500;line-height:1.5;opacity:.95}
.chars{display:flex;justify-content:center;gap:6px;align-items:flex-end;margin:14px 0 4px}
.chars img{height:104px}
.lock{margin:6px auto 0;width:120px;transition:transform .3s}
.lock .shackle{transition:transform .5s;transform-origin:34px 52px}
.open .shackle{transform:translateY(-10px) rotate(-28deg)}
.digits{display:flex;gap:10px;justify-content:center;margin:6px 0 14px}
.digits input{width:62px;height:76px;border-radius:12px;border:4px solid var(--orange);background:#fff;color:var(--navy);font-size:40px;font-weight:900;text-align:center;font-family:inherit;outline:none;caret-color:var(--orange)}
.digits input:focus{border-color:var(--yellow);box-shadow:0 0 0 4px rgba(255,201,40,.45)}
button{font-family:inherit;cursor:pointer;border:0}
.go{background:var(--yellow);color:var(--navy);font-size:20px;font-weight:900;padding:14px 40px;border-radius:40px;box-shadow:0 5px 0 #c99a00}
.go:active{transform:translateY(3px);box-shadow:0 2px 0 #c99a00}
.msg{min-height:28px;margin-top:14px;font-size:16px;font-weight:700}
.msg.bad{color:#ffd9b8}
.digits input.bad{border-color:#ff4d4d;background:#ffecec;color:#c62828}
.shake{animation:shake .45s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-7px)}80%{transform:translateX(7px)}}
.hints{display:none;margin-top:14px;background:rgba(255,255,255,.16);border:2px dashed rgba(255,255,255,.7);border-radius:16px;padding:14px}
.hints.show{display:block}
.hints h2{font-size:15px;color:var(--yellow);margin-bottom:8px}
.hbtn{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.hbtn button{background:#fff;color:var(--navy);font-weight:900;font-size:14px;padding:8px 14px;border-radius:20px}
.hbtn button.on{background:var(--orange);color:#fff}
.htext{margin-top:10px;font-size:14.5px;line-height:1.55;font-weight:500;text-align:left;min-height:46px}
.win{display:none}
.win.show{display:block}
.win h2{font-size:34px;font-weight:900;color:var(--yellow);text-shadow:0 3px 0 var(--orange);margin:10px 0 6px}
.win p{font-size:16px;line-height:1.55;font-weight:500}
.cert{margin-top:18px;background:#fff;color:var(--navy);border-radius:18px;padding:16px}
.cert label{display:block;font-size:14px;font-weight:900;margin-bottom:8px}
.cert input{width:100%;font-size:18px;font-family:inherit;padding:10px 12px;border:3px solid var(--teal);border-radius:10px;text-align:center}
.cert button{margin-top:10px;background:var(--teal);color:#fff;font-weight:900;font-size:16px;padding:12px 22px;border-radius:30px}
canvas#cv{display:none;width:100%;margin-top:12px;border-radius:12px}
canvas#cv.show{display:block}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:9}
footer{margin-top:26px;font-size:12px;opacity:.8}
.chest .lid{transition:transform .7s cubic-bezier(.3,1.5,.5,1);transform-origin:12px 52px}
.open .chest .lid,.chest.open .lid{transform:translate(-2px,-10px) rotate(-22deg)}
.chest .glow{opacity:0;transition:opacity .5s .35s}.open .chest .glow{opacity:1}
#snowfx{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
#snowfx i{position:absolute;top:-12px;color:#fff;opacity:.75;animation:snowfall linear infinite;font-style:normal;line-height:1}
@keyframes snowfall{to{transform:translate(var(--dx),110vh) rotate(180deg)}}
main{position:relative;z-index:1}
@media (prefers-reduced-motion:reduce){#snowfx i{animation:none;display:none}}
.chars{position:relative;margin-top:44px!important}.chars img.buddy{position:absolute;height:auto;width:60px;left:calc(50% + 56px);top:-44px;transform:rotate(-6deg)}

.t3{position:relative;width:250px!important;height:270px;margin:0 auto;perspective:760px;perspective-origin:50% -30%}
.t3 .c3{position:absolute;left:40px;top:144px;width:170px;height:86px;transform-style:preserve-3d;transform:rotateX(-16deg) rotateY(-24deg)}
.t3 .f,.t3 .l{position:absolute;box-sizing:border-box;backface-visibility:hidden}
.t3 .f{background:repeating-linear-gradient(0deg,#b8692a 0 15px,#a65c22 15px 17px);border:5px solid #f2b51c;box-shadow:inset 0 0 0 2px #8a5a10}
.t3 .front{left:0;top:0;width:170px;height:86px;transform:translateZ(52.0px)}
.t3 .back{left:0;top:0;width:170px;height:86px;transform:rotateY(180deg) translateZ(52.0px)}
.t3 .left{left:33.0px;top:0;width:104px;height:86px;transform:rotateY(-90deg) translateZ(85.0px);filter:brightness(.8)}
.t3 .right{left:33.0px;top:0;width:104px;height:86px;transform:rotateY(90deg) translateZ(85.0px);filter:brightness(.8)}
.t3 .hole{left:0;top:-49.0px;width:170px;height:104px;transform:rotateX(90deg);background:radial-gradient(ellipse at 50% 50%,#ffe9a0 0,#7a3f17 55%,#3a1a06 100%);border:5px solid #f2b51c;backface-visibility:visible}
.t3 .lock{position:absolute;left:72.0px;top:6px;width:26px;height:30px;border-radius:5px;background:#ffc928;border:2px solid #a8730c;transform:translateZ(53.0px)}
.t3 .lock:after{content:'';position:absolute;left:9px;top:6px;width:8px;height:8px;border-radius:50%;background:#0d3b57;box-shadow:0 7px 0 -1px #0d3b57}
.t3 .lid{position:absolute;left:0;top:-34px;width:170px;height:34px;transform-style:preserve-3d;transform-origin:50% 100% -52.0px;transition:transform 1s cubic-bezier(.3,1.25,.5,1)}
.t3 .l{background:repeating-linear-gradient(0deg,#b8692a 0 15px,#a65c22 15px 17px);border:5px solid #f2b51c;box-shadow:inset 0 0 0 2px #8a5a10}
.t3 .lfront{left:0;top:0;width:170px;height:34px;transform:translateZ(52.0px);border-radius:10px 10px 0 0}
.t3 .lback{left:0;top:0;width:170px;height:34px;transform:rotateY(180deg) translateZ(52.0px);border-radius:10px 10px 0 0;backface-visibility:visible;filter:brightness(.75)}
.t3 .lleft{left:33.0px;top:0;width:104px;height:34px;transform:rotateY(-90deg) translateZ(85.0px);filter:brightness(.8);border-radius:10px 10px 0 0;backface-visibility:visible}
.t3 .lright{left:33.0px;top:0;width:104px;height:34px;transform:rotateY(90deg) translateZ(85.0px);filter:brightness(.8);border-radius:10px 10px 0 0;backface-visibility:visible}
.t3 .ltop{left:0;top:-52.0px;width:170px;height:104px;transform:rotateX(90deg);background:repeating-linear-gradient(90deg,#b8692a 0 15px,#a65c22 15px 17px)}
.t3 .lin{left:0;top:-52.0px;width:170px;height:104px;transform:rotateX(-90deg);background:linear-gradient(#5e2f0f,#8a4a1c);border-color:#d99a12}
.t3 .fz{position:absolute;bottom:88px;opacity:0;transform:translateZ(-6px) translateY(50px) scale(.6);transition:transform 1s cubic-bezier(.2,1.3,.4,1) .8s,opacity .5s .8s;filter:drop-shadow(0 3px 4px rgba(0,0,0,.5))}
.t3 .fz1{left:-4px;width:122px}
.t3 .fz2{right:-6px;width:84px;transition-delay:1.05s}
.t3.open .lid{transform:rotateX(105deg)}
.t3.open .fz{opacity:1;transform:translateZ(-6px)}

.t3{margin:0 auto!important;transform:none!important}
.stage{position:relative;display:flex;align-items:flex-end;justify-content:center;margin:2px -6px 0;height:232px}
.stage .sj{height:92px;width:auto;flex:0 0 auto;margin-right:-8px;position:relative;z-index:2}
.stage .cwrap{flex:0 0 200px;width:200px;height:232px;position:relative}
.stage .cwrap .t3{position:absolute!important;left:-25px;top:4px;transform:scale(.8)!important;transform-origin:50% 0}
.stage .sr{position:relative;flex:0 0 auto;margin-left:-8px;z-index:2}
.stage .ss{height:86px;width:auto;display:block}
.stage .sb{position:absolute;width:54px;height:auto;left:4px;top:-62px;transform:rotate(-6deg)}
.winmsg{word-break:keep-all}.winmsg .nm{color:#ffc928}
</style>
</head>

<script>
/* 정답은 간단한 해시로만 보관합니다 (화면에서 바로 읽히지 않게) */
var ANSWER_HASH="1w174sd9ue", ANSWER_LEN=4;
function h(s){var a=0xdeadbeef^7,b=0x41c6ce57^7;for(var i=0;i<s.length;i++){var c=s.charCodeAt(i);a=Math.imul(a^c,2654435761);b=Math.imul(b^c,1597334677)}
  a=Math.imul(a^(a>>>16),2246822507)^Math.imul(b^(b>>>13),3266489909);b=Math.imul(b^(b>>>16),2246822507)^Math.imul(a^(a>>>13),3266489909);
  return (4294967296*(2097151&b)+(a>>>0)).toString(36)}
/* 자리별 확인용: 자리마다 해시 */
var POS_HASH=["7ds0wp90xh","6nci13rkbu","1ditbs575zs","vreucl36vc"];
var HINTS=[
 "오목렌즈는 빛을 바깥쪽으로 퍼뜨려요. 맨 위 줄기는 렌즈를 지나면 원래 높이보다 더 위로 꺾여요.",
 "줄이 추를 받치는 가닥이 많을수록 힘이 적게 들어요. 세 도르래를 직접 당겨 보고, 패널의 비율 숫자도 살펴봐요.",
 "문손잡이를 돌릴 때 손잡이가 길수록 어떤지 떠올려 봐요. 크기가 다른 핸들을 직접 번갈아 돌려 비교해 보세요.",
 "눈으로 본 정보는 먼저 뇌로 가서 판단돼요. 판단이 끝난 뒤에야 손이 움직여요."
];
var ins=[].slice.call(document.querySelectorAll('#digits input')),msg=document.getElementById('msg'),wrong=0;
ins.forEach(function(el,i){
  el.addEventListener('input',function(){el.classList.remove('bad');el.value=el.value.replace(/[^0-9]/g,'').slice(0,1);if(el.value&&ins[i+1])ins[i+1].focus()});
  el.addEventListener('keydown',function(e){if(e.key==='Backspace'&&!el.value&&ins[i-1])ins[i-1].focus();if(e.key==='Enter')check()});
  el.addEventListener('focus',function(){el.select()});
});
document.getElementById('goBtn').addEventListener('click',check);
var hb=document.getElementById('hbtn');
HINTS.forEach(function(t,i){var b=document.createElement('button');b.textContent='미션 '+(i+1);
  b.onclick=function(){[].forEach.call(hb.children,function(x){x.classList.remove('on')});b.classList.add('on');document.getElementById('htext').textContent=t};hb.appendChild(b)});
function check(){
  var v=ins.map(function(x){return x.value}).join('');
  if(v.length<ANSWER_LEN){say('숫자 4개를 모두 입력해 주세요.',1);return}
  if(h(v)===ANSWER_HASH){win();return}
  var bad=[];ins.forEach(function(el){el.classList.remove('bad')});
  for(var i=0;i<ANSWER_LEN;i++){if(h('p'+i+v[i])!==POS_HASH[i]){bad.push(i);ins[i].classList.add('bad')}}
  wrong++;
  var d=document.getElementById('digits');d.classList.remove('shake');void d.offsetWidth;d.classList.add('shake');
  say('상자가 열리지 않아요! '+bad.map(function(i){return (i+1)+'번째'}).join(', ')+' 숫자가 틀렸어요.',1);
  document.getElementById('hints').classList.add('show');
}
function say(t,bad){msg.textContent=t;msg.className='msg'+(bad?' bad':'')}
function win(){
  document.getElementById('lock').classList.add('open');
  setTimeout(function(){var w=document.getElementById('win');document.getElementById('play').style.display='none';w.classList.add('show');window.scrollTo(0,0);boom()},2300);
}
/* 폭죽 */
function boom(){
  var c=document.getElementById('conf'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;
  var cols=['#ffc928','#ff7a2f','#f2589b','#33a8e6','#fff'],p=[];
  for(var i=0;i<140;i++)p.push({x:Math.random()*c.width,y:-20-Math.random()*c.height*.6,r:4+Math.random()*6,vy:2+Math.random()*4,vx:-1.5+Math.random()*3,c:cols[i%5],a:Math.random()*6});
  var t=0;(function f(){x.clearRect(0,0,c.width,c.height);p.forEach(function(q){q.y+=q.vy;q.x+=q.vx+Math.sin(q.a+=.06);x.fillStyle=q.c;x.fillRect(q.x,q.y,q.r,q.r*1.6)});
    if(++t<260)requestAnimationFrame(f);else x.clearRect(0,0,c.width,c.height)})();
}
/* 수료증 */
document.getElementById('mk').addEventListener('click',function(){
  var n=(document.getElementById('nm').value||'').trim();if(!n){askName();return;}
  var c=document.getElementById('cv'),x=c.getContext('2d'),W=c.width,H=c.height;
  x.fillStyle='#fff7e3';x.fillRect(0,0,W,H);
  x.strokeStyle='#1593ad';x.lineWidth=18;x.strokeRect(24,24,W-48,H-48);
  x.strokeStyle='#ffc928';x.lineWidth=6;x.strokeRect(46,46,W-92,H-92);
  x.textAlign='center';x.fillStyle='#0d3b57';
  x.font='900 70px "Noto Sans KR","Malgun Gothic",sans-serif';x.fillText('과학 보물 탐험가 인증서',W/2,170);
  x.font='900 78px "Noto Sans KR","Malgun Gothic",sans-serif';x.fillStyle='#ff7a2f';x.fillText(n,W/2,300);
  x.fillStyle='#0d3b57';x.font='500 34px "Noto Sans KR","Malgun Gothic",sans-serif';
  x.fillText('뛰어난 과학 실력으로 4개의 미션을 풀고',W/2,380);x.fillText('과학 보물 상자를 열었음을 인증합니다.',W/2,428);
  x.font='700 30px "Noto Sans KR","Malgun Gothic",sans-serif';x.fillStyle='#1593ad';x.fillText('경상남도교육청 과학교육원',W/2,540);
  finishCert(c);
});

var certFile=null,certUrl=null;
function finishCert(c){
  c.toBlob(function(b){
    certFile=new File([b],'과학보물탐험가_인증서.png',{type:'image/png'});
    if(certUrl)URL.revokeObjectURL(certUrl);certUrl=URL.createObjectURL(b);
    var im=document.getElementById('cimg');im.src=certUrl;im.style.display='block';
    document.getElementById('savetip').style.display='block';
    var d=document.getElementById('dl');d.style.display='inline-block';
  },'image/png');
}
function saveCert(){
  if(!certFile)return;
  if(navigator.canShare&&navigator.canShare({files:[certFile]})){
    navigator.share({files:[certFile],title:'과학 보물 탐험가 인증서'}).catch(function(){});
  }else{
    var a=document.createElement('a');a.download='과학보물탐험가_인증서.png';a.href=certUrl;document.body.appendChild(a);a.click();a.remove();
  }
}
document.getElementById('dl').addEventListener('click',saveCert);
</script>
